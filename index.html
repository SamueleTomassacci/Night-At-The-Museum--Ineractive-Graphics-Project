<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Midnight Museum: The Awakening</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #050711;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        color: #eef3ff;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #ui-root {
        position: fixed;
        inset: 16px auto auto 16px;
        z-index: 10;
        width: min(360px, calc(100vw - 32px));
        pointer-events: none;
      }

      .museum-panel {
        border: 1px solid rgba(168, 195, 255, 0.26);
        border-radius: 8px;
        background: rgba(8, 12, 28, 0.78);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.34);
        padding: 14px;
        backdrop-filter: blur(10px);
        pointer-events: auto;
      }

      .museum-panel h1 {
        margin: 0 0 10px;
        font-size: 18px;
        line-height: 1.2;
        font-weight: 740;
      }

      .museum-grid {
        display: grid;
        gap: 8px;
        font-size: 13px;
        color: #cdd8ff;
      }

      .museum-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .museum-key {
        color: #8998c9;
      }

      .museum-section-row {
        margin-top: 4px;
        padding-top: 6px;
        border-top: 1px solid rgba(255, 228, 174, 0.18);
      }

      .museum-section-row:first-child {
        margin-top: 0;
        padding-top: 0;
        border-top: 0;
      }

      .museum-section-row .museum-key {
        color: #ffe4ae;
        font-size: 12px;
        font-weight: 760;
        text-transform: uppercase;
      }

      .museum-value {
        color: #ffffff;
        text-align: right;
      }

      .museum-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      .museum-control {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        border: 1px solid rgba(168, 195, 255, 0.22);
        border-radius: 6px;
        background: rgba(20, 28, 56, 0.82);
        color: #eef3ff;
        font: inherit;
        cursor: pointer;
      }

      select.museum-control {
        padding-inline: 10px;
      }

      .museum-control:hover {
        border-color: rgba(255, 222, 153, 0.62);
      }
    </style>
  </head>
  <body>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
